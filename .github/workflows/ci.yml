name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/wastewise_ci?replicaSet=rs0&directConnection=true&retryWrites=false
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      CSRF_SECRET: ci-csrf-secret-at-least-32-characters-long
      ML_INTERNAL_API_KEY: ci-ml-internal-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start MongoDB replica set
        run: |
          docker run -d --name wastewise-mongo --network host mongo:8.0 mongod --replSet rs0 --bind_ip_all
          until docker exec wastewise-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; do sleep 2; done
          docker exec wastewise-mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          until docker exec wastewise-mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1; do sleep 2; done
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: python -m pip install -r ml-service/requirements-dev.txt
      - run: python -m pytest ml-service/tests data
      - run: python -m ruff check ml-service data
