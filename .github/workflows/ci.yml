name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/wastewise_ci?directConnection=true&retryWrites=false
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      CSRF_SECRET: ci-csrf-secret-at-least-32-characters-long
      ML_INTERNAL_API_KEY: ci-ml-internal-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: python -m pip install -r ml-service/requirements-dev.txt
      - run: python -m pytest ml-service/tests data
      - run: python -m ruff check ml-service data
