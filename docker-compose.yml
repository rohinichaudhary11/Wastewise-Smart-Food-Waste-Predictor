services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - wastewise-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "mongodb://mongo:27017/admin?directConnection=true", "--quiet", "--eval"]
    command:
      - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); } while (rs.status().myState !== 1) { sleep(1000); }"
  ml-service:
    build:
      context: ./ml-service
    environment:
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:?Set ML_INTERNAL_API_KEY in .env}
      MODEL_DIR: /app/models
      MIN_MODEL_RECORDS: ${MIN_MODEL_RECORDS:-28}
      MIN_BASELINE_RECORDS: ${MIN_BASELINE_RECORDS:-7}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wastewise-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
volumes:
  wastewise-mongo:
  wastewise-models:
